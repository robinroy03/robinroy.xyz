{{- if strings.HasPrefix .Destination "mailto:" -}}
{{- $email := strings.TrimPrefix "mailto:" .Destination -}}
<span class="email-menu"><button type="button" class="email-menu__trigger">{{ .Text }}</button><span class="email-menu__list"><button type="button" class="email-menu__copy" data-email="{{ $email }}">Copy {{ $email }}</button><a href="https://mail.google.com/mail/?view=cm&to={{ $email }}" target="_blank" rel="noopener noreferrer">Open in Gmail</a><a href="{{ .Destination | safeURL }}">Open default client</a></span></span>
{{- else -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.HasPrefix .Destination "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text }}</a>
{{- end -}}
