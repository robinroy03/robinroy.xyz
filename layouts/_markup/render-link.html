{{- if strings.HasPrefix .Destination "mailto:" -}}
{{- $email := strings.TrimPrefix "mailto:" .Destination -}}
<span class="email-menu"><button type="button" class="email-menu__trigger">{{ .Text }}</button><span class="email-menu__list"><button type="button" class="email-menu__copy" data-email="{{ $email }}">Copy {{ $email }}</button><a href="{{ .Destination | safeURL }}">Open default client</a></span></span>
{{- else -}}
{{- partial "anchor.html" (dict "href" .Destination "text" .Text "title" .Title) -}}
{{- end -}}
