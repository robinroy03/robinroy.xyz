<script>
  // Apply saved theme before first paint to avoid a flash of the wrong theme
  (function () {
    var theme = localStorage.getItem("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  })();
